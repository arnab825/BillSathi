services:
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: billsathi-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: billsathi-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/billsathi.db
      - OLLAMA_BASE_URL=http://billsathi-ollama:11434
      - OLLAMA_MODEL=gemma2:2b
      - OLLAMA_TIMEOUT_SECONDS=45.0
      - ENVIRONMENT=development
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/data:/app/data
      - ./backend/app:/app/app
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: billsathi-frontend
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  billsathi-data:
  ollama-models:

